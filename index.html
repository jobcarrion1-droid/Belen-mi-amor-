<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Para Belén ❤️‍🩹</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;color:#fff;font-family:Georgia,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:2rem 1.5rem 4rem;overflow:hidden;position:relative;}
.sparkle{position:absolute;width:4px;height:4px;background:#FFD700;border-radius:50%;animation:twinkle 2.5s infinite;}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
.moon{position:absolute;top:8%;right:5%;width:180px;height:180px;border-radius:50%;background:linear-gradient(45deg,#FFD700,#FFE55C);box-shadow:0 0 60px rgba(255,215,0,.3);}
.moon-shadow{position:absolute;top:6%;right:2%;width:170px;height:170px;border-radius:50%;background:#000;}
.leaf{position:absolute;width:14px;height:7px;background:#FFD700;border-radius:50%;opacity:.5;animation:fall 7s linear infinite;}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:0}15%{opacity:.5}100%{transform:translateY(100vh) rotate(360deg);opacity:0}}
.top-content{margin-top:2rem;position:relative;z-index:10;}
.sub-title{font-size:1rem;letter-spacing:4px;color:#b89f2f;margin-bottom:.8rem;}
h1{font-size:clamp(2.5rem,7vw,3.8rem);color:#FFD700;font-weight:normal;line-height:1.3;}
h1 span{color:#fff;}
.middle-text{font-size:clamp(1rem,3vw,1.2rem);color:#ddd;max-width:450px;line-height:1.8;margin:1.5rem 0 2rem;position:relative;z-index:10;}
.flowers-container{position:relative;width:100%;height:320px;margin-bottom:1rem;}
.flower{position:absolute;bottom:0;opacity:0;transform:translateY(40px);transition:all 1.5s ease-out;}
.flower.show{opacity:1;transform:translateY(0);}
.bloom{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,#FFD700 35%,#8B4513 36%);margin:0 auto;position:relative;}
.stem{width:4px;background:linear-gradient(to bottom,#4caf50,#2e7d32);margin:0 auto;}
.btn{padding:1rem 3rem;font-size:1.2rem;border:2px solid #FFD700;border-radius:50px;background:transparent;color:#FFD700;cursor:pointer;letter-spacing:2px;transition:all .4s;position:relative;z-index:10;}
.btn:hover{background:#FFD700;color:#000;}
audio{display:none;}
</style>
</head>
<body>
<div class="moon"></div>
<div class="moon-shadow"></div>
<div class="top-content">
<p class="sub-title">PARA TI</p>
<h1>Para mi novia y futura esposa<br><span style="color:#FFD700">Belén</span> ❤️‍🩹</h1>
</div>
<p class="middle-text">Para la chica que está a mi costado,<br>en las buenas y en las malas.<br>Con quien quiero estar<br>por el resto de mi vida entera.</p>
<div class="flowers-container" id="florero"></div>
<button class="btn" id="boton" onclick="activar()">💛 Ábrelo, amor 💛</button>
<audio id="musica" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
<script>
for(let i=0;i<70;i++){let s=document.createElement('div');s.className='sparkle';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';document.body.appendChild(s);}
for(let i=0;i<8;i++){setTimeout(()=>{let l=document.createElement('div');l.className='leaf';l.style.left=Math.random()*90+5+'%';l.style.animationDelay=Math.random()*7+'s';document.body.appendChild(l);},i*400);}
const pos=[{left:'3%',h:180},{left:'12%',h:200},{left:'22%',h:260},{left:'34%',h:190},{left:'45%',h:240},{left:'55%',h:210},{left:'65%',h:200},{left:'76%',h:250},{left:'88%',h:220},{left:'94%',h:190}];
const fl=document.getElementById('florero');
pos.forEach((p,i)=>{let f=document.createElement('div');f.className='flower';f.style.left=p.left;f.innerHTML='<div class="bloom"></div><div class="stem" style="height:'+p.h+'px"></div>';fl.appendChild(f);});
let listo=false;
function activar(){if(listo)return;listo=true;document.getElementById('musica').play().catch(e=>{});document.querySelectorAll('.flower').forEach((f,i)=>{setTimeout(()=>{f.classList.add('show');},i*250);});document.getElementById('boton').innerText='💐 Para Belén 💐';}
</script>
</body>
</html>
